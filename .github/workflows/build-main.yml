name: Build main preview

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: documentation-main-preview, path: build, retention-days: 14}
