name: Export delivery bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable docs tag to export
        required: true
        type: string
      formats:
        description: pdf,docx,html
        required: true
        default: pdf,docx,html
        type: string
      include_progress:
        description: Include progress information
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ inputs.ref }}, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: docker build -f export/Dockerfile -t smart-water-docs-export:${{ github.sha }} .
      - run: docker run --rm -v "$PWD:/workspace" smart-water-docs-export:${{ github.sha }} --ref HEAD --formats "${{ inputs.formats }}" ${{ inputs.include_progress && '--include-progress' || '--exclude-progress' }}
      - run: cd delivery && test ! -d offline-html || zip -qr smart-water-platform-offline-html.zip offline-html
      - uses: actions/upload-artifact@v4
        with: {name: smart-water-platform-delivery-${{ inputs.ref }}, path: delivery, retention-days: 90}
