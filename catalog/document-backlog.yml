collaboration:
  coordination_task_prefix: DOC-
  claim_authority: backend coordination board
  recommended_claim_scope: one document path per agent
  lookup_examples:
    - "rg -n 'id: algorithm.hampel' catalog/document-backlog.yml"
    - "rg -n 'status: (missing|expand)' catalog/document-backlog.yml"
  status_values:
    ready: Current content is adequate for the implemented capability and has been
      reviewed.
    expand: A published sample exists but does not yet cover the complete
      implemented capability.
    missing: The implemented capability has no dedicated document yet.
    deferred: The capability is retained for compatibility or later delivery and is
      not a current writing priority.
  priority_values:
    P0: Required for current demonstration, handover, or September closed-loop
      acceptance.
    P1: Required for the complete platform delivery and routine operation.
    P2: Compatibility, advanced administration, or supporting reference material.
  completion_rule: A document becomes ready only after content review, link and
    metadata validation, site build, and inclusion in an approved snapshot.
