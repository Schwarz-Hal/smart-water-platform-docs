<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Chronos-2 核心预测架构</title><desc id="desc">输入时序经过稳健缩放、元特征、分块嵌入、时间注意力和组注意力，最后由分位数预测头输出多个分位数。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#edf7f8"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3976a8"/></marker><style>.t{font:700 22px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.b{font:700 16px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.s{font:13px Inter,Microsoft YaHei,sans-serif;fill:#536b82}.n{fill:#fff;stroke:#8fb7dc;stroke-width:1.5}.ar{stroke:#3976a8;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="40" y="48" class="t">Chronos-2：从时序输入到概率预测</text>
  <g transform="translate(40 108)"><rect class="n" width="165" height="190" rx="16"/><text x="82" y="35" text-anchor="middle" class="b">输入时序</text><path d="M24 105c20-65 38 40 57-8s44-50 62 8" fill="none" stroke="#1886b3" stroke-width="4"/><path d="M24 137c19-26 39 35 58-2s40-25 61 8" fill="none" stroke="#55a89b" stroke-width="3"/><text x="82" y="165" text-anchor="middle" class="s">目标 · 协变量</text></g>
  <path class="ar" d="M213 203h50"/><g transform="translate(275 108)"><rect class="n" width="180" height="190" rx="16"/><text x="90" y="35" text-anchor="middle" class="b">缩放与元特征</text><rect x="25" y="60" width="130" height="32" rx="8" fill="#e9f8f5"/><text x="90" y="82" text-anchor="middle" class="s">asinh 稳健缩放</text><rect x="25" y="108" width="130" height="32" rx="8" fill="#eef5ff"/><text x="90" y="130" text-anchor="middle" class="s">相对时间索引</text><text x="90" y="170" text-anchor="middle" class="s">观测掩码</text></g>
  <path class="ar" d="M463 203h50"/><g transform="translate(525 108)"><rect class="n" width="160" height="190" rx="16"/><text x="80" y="35" text-anchor="middle" class="b">分块嵌入</text><g transform="translate(25 65)"><rect width="30" height="58" rx="6" fill="#d9e6ff"/><rect x="40" width="30" height="58" rx="6" fill="#cdddf9"/><rect x="80" width="30" height="58" rx="6" fill="#bdcfef"/></g><text x="80" y="170" text-anchor="middle" class="s">非重叠 patch</text></g>
  <path class="ar" d="M693 203h45"/><g transform="translate(750 78)"><rect width="250" height="250" rx="18" fill="#eaf5f8" stroke="#7ea6cc" stroke-width="1.5"/><text x="125" y="35" text-anchor="middle" class="b">Encoder-only Transformer</text><rect x="25" y="58" width="200" height="56" rx="12" class="n"/><text x="125" y="83" text-anchor="middle" class="b">时间注意力</text><text x="125" y="102" text-anchor="middle" class="s">同一序列内跨时间 patch</text><path d="M125 119v23" class="ar"/><rect x="25" y="150" width="200" height="56" rx="12" class="n"/><text x="125" y="175" text-anchor="middle" class="b">组注意力</text><text x="125" y="194" text-anchor="middle" class="s">相关目标与协变量间共享信息</text></g>
  <path class="ar" d="M1008 203h42"/><g transform="translate(1062 108)"><rect class="n" width="106" height="190" rx="16"/><text x="53" y="35" text-anchor="middle" class="b">分位数头</text><g class="s" text-anchor="middle"><rect x="18" y="62" width="70" height="28" rx="14" fill="#dff3ee"/><text x="53" y="82">P10</text><rect x="18" y="104" width="70" height="28" rx="14" fill="#dceaff"/><text x="53" y="124">P50</text><rect x="18" y="146" width="70" height="28" rx="14" fill="#eee5ff"/><text x="53" y="166">P90</text></g></g>
  <g transform="translate(40 366)"><rect width="1128" height="82" rx="14" fill="#fff" stroke="#d7e1ec"/><text x="24" y="31" class="b">关键机制</text><text x="24" y="58" class="s">直接多步预测 · 概率分位数输出 · 组内上下文学习 · 单变量 / 多变量 / 协变量统一建模</text></g>
</svg>
