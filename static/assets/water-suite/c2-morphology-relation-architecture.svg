<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="c2-title c2-desc">
  <title id="c2-title">C2 形态—关系一致性多证据异常检测架构</title>
  <desc id="c2-desc">流量和压力窗口与训练集相关性推断的拓扑上下文共同进入形态、关系和历史证据分支；证据与正常记忆融合后输出异常分数、类型候选和诊断路径候选。</desc>
  <defs>
    <linearGradient id="c2-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#edf7f8"/></linearGradient>
    <marker id="c2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3976a8"/></marker>
    <style>.c2-t{font:700 22px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.c2-b{font:700 16px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.c2-s{font:13px Inter,Microsoft YaHei,sans-serif;fill:#536b82}.c2-n{fill:#fff;stroke:#8fb7dc;stroke-width:1.5}.c2-a{stroke:#3976a8;stroke-width:3;fill:none;marker-end:url(#c2-arrow)}</style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#c2-bg)"/><text x="40" y="48" class="c2-t">C2：形态、关系与历史证据融合</text>
  <g transform="translate(40 95)"><rect class="c2-n" width="170" height="205" rx="16"/><text x="85" y="34" text-anchor="middle" class="c2-b">输入窗口</text><path d="M22 102c22-62 39 43 61-6s42-43 66 8" fill="none" stroke="#1886b3" stroke-width="4"/><path d="M22 137c24-30 44 30 65-3s42-23 62 9" fill="none" stroke="#55a89b" stroke-width="3"/><text x="85" y="177" text-anchor="middle" class="c2-s">流量 · 压力 · 时间特征</text></g>
  <g transform="translate(40 330)"><rect class="c2-n" width="170" height="88" rx="14"/><text x="85" y="30" text-anchor="middle" class="c2-b">训练集关系上下文</text><text x="85" y="56" text-anchor="middle" class="c2-s">Pearson 相关 · 邻居权重</text><text x="85" y="75" text-anchor="middle" class="c2-s">关系代理，不是物理拓扑</text></g>
  <path class="c2-a" d="M218 198h32"/><path class="c2-a" d="M218 372h24v-120h8"/>
  <g transform="translate(260 75)"><rect width="250" height="260" rx="18" fill="#eaf5f8" stroke="#7ea6cc" stroke-width="1.5"/><text x="125" y="34" text-anchor="middle" class="c2-b">三条证据分支</text><rect x="20" y="56" width="210" height="48" rx="10" class="c2-n"/><text x="125" y="78" text-anchor="middle" class="c2-b">形态</text><text x="125" y="95" text-anchor="middle" class="c2-s">均值 · 频谱 · 斜率 · 自相关</text><rect x="20" y="116" width="210" height="48" rx="10" class="c2-n"/><text x="125" y="138" text-anchor="middle" class="c2-b">关系一致性</text><text x="125" y="155" text-anchor="middle" class="c2-s">变化 · 上下文差异 · 耦合</text><rect x="20" y="176" width="210" height="48" rx="10" class="c2-n"/><text x="125" y="198" text-anchor="middle" class="c2-b">历史规则</text><text x="125" y="215" text-anchor="middle" class="c2-s">历史先验 · 一步预测</text></g>
  <path class="c2-a" d="M526 205h30"/>
  <g transform="translate(565 100)"><rect class="c2-n" width="185" height="210" rx="16"/><text x="92" y="35" text-anchor="middle" class="c2-b">自适应融合</text><rect x="22" y="68" width="141" height="38" rx="10" fill="#dceaff"/><text x="92" y="92" text-anchor="middle" class="c2-s">evidence 向量</text><path class="c2-a" d="M92 113v22"/><rect x="22" y="146" width="141" height="38" rx="10" fill="#e9f8f5"/><text x="92" y="170" text-anchor="middle" class="c2-s">softmax 权重</text></g>
  <path class="c2-a" d="M766 205h28"/>
  <g transform="translate(803 75)"><rect width="175" height="260" rx="16" fill="#fff" stroke="#8fb7dc" stroke-width="1.5"/><text x="87" y="34" text-anchor="middle" class="c2-b">正常证据记忆</text><g fill="#cfe7e2"><circle cx="43" cy="75" r="9"/><circle cx="80" cy="62" r="9"/><circle cx="120" cy="84" r="9"/><circle cx="62" cy="110" r="9"/><circle cx="111" cy="124" r="9"/></g><text x="87" y="162" text-anchor="middle" class="c2-s">Top-K 局部参考</text><text x="87" y="185" text-anchor="middle" class="c2-s">均值 / 方差非负标准化</text><path class="c2-a" d="M87 200v24"/><text x="87" y="248" text-anchor="middle" class="c2-s">异常分数</text></g>
  <path class="c2-a" d="M986 205h26"/>
  <g transform="translate(1021 87)"><rect class="c2-n" width="139" height="236" rx="16"/><text x="69" y="34" text-anchor="middle" class="c2-b">解释候选</text><rect x="15" y="62" width="109" height="38" rx="10" fill="#eee5ff"/><text x="69" y="86" text-anchor="middle" class="c2-s">类型 Top-K</text><rect x="15" y="114" width="109" height="38" rx="10" fill="#dff3ee"/><text x="69" y="138" text-anchor="middle" class="c2-s">诊断路径</text><text x="69" y="177" text-anchor="middle" class="c2-s">邻居 · 责任节点</text><text x="69" y="198" text-anchor="middle" class="c2-s">建议（候选）</text></g>
  <g transform="translate(260 370)"><rect width="720" height="68" rx="14" fill="#fff" stroke="#d7e1ec"/><text x="24" y="29" class="c2-b">关键机制</text><text x="24" y="52" class="c2-s">关系上下文由训练数据相关性推断；类型、路径和建议均为解释候选，不证明真实根因或物理连接。</text></g>
</svg>
