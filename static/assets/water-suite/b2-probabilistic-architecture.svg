<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">B2 外生驱动轻量概率预测架构</title>
  <desc id="desc">流量、压力历史与时间及可选外生特征经过门控交互、GRU 和 Transformer 编码，由单调分位数头输出 P10、P50、P90，再用 conformal 方法扩张区间并计算超阈概率和风险等级。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#edf7f8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3976a8"/></marker>
    <style>.t{font:700 22px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.b{font:700 15px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.s{font:13px Inter,Microsoft YaHei,sans-serif;fill:#536b82}.n{fill:#fff;stroke:#8fb7dc;stroke-width:1.5}.ar{stroke:#3976a8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" class="t">B2：外生驱动轻量概率预测</text>
  <g transform="translate(35 105)"><rect class="n" width="175" height="190" rx="16"/><text x="87" y="34" text-anchor="middle" class="b">历史与外生输入</text><text x="87" y="67" text-anchor="middle" class="s">96 点流量 · 压力</text><text x="87" y="91" text-anchor="middle" class="s">时间周期特征</text><text x="87" y="115" text-anchor="middle" class="s">可选天气/状态/调度</text><path d="M24 148c20-32 38 22 58-6s43-22 67 5" fill="none" stroke="#1886b3" stroke-width="4"/></g>
  <path class="ar" d="M218 200h30"/>
  <g transform="translate(250 105)"><rect class="n" width="180" height="190" rx="16"/><text x="90" y="34" text-anchor="middle" class="b">门控交互</text><rect x="20" y="59" width="140" height="38" rx="9" fill="#e9f8f5"/><text x="90" y="83" text-anchor="middle" class="s">外生编码 + 位置</text><rect x="20" y="111" width="140" height="38" rx="9" fill="#eef5ff"/><text x="90" y="135" text-anchor="middle" class="s">历史/外生 sigmoid 门</text><text x="90" y="176" text-anchor="middle" class="s">加权交互状态</text></g>
  <path class="ar" d="M440 200h35"/>
  <g transform="translate(475 105)"><rect class="n" width="185" height="190" rx="16"/><text x="92" y="34" text-anchor="middle" class="b">时序编码器</text><rect x="20" y="60" width="145" height="38" rx="9" fill="#e9f8f5"/><text x="92" y="84" text-anchor="middle" class="s">GRU</text><rect x="20" y="112" width="145" height="38" rx="9" fill="#eef5ff"/><text x="92" y="136" text-anchor="middle" class="s">Transformer</text><text x="92" y="178" text-anchor="middle" class="s">末端状态 + 设备嵌入</text></g>
  <path class="ar" d="M670 200h35"/>
  <g transform="translate(705 105)"><rect class="n" width="175" height="190" rx="16"/><text x="87" y="34" text-anchor="middle" class="b">单调分位数头</text><text x="87" y="61" text-anchor="middle" class="s">softplus 保证有序</text><rect x="27" y="79" width="121" height="28" rx="14" fill="#dff3ee"/><text x="87" y="98" text-anchor="middle" class="s">P10 · 下界</text><rect x="27" y="115" width="121" height="28" rx="14" fill="#dceaff"/><text x="87" y="134" text-anchor="middle" class="s">P50 · 中心</text><rect x="27" y="151" width="121" height="28" rx="14" fill="#eee5ff"/><text x="87" y="170" text-anchor="middle" class="s">P90 · 上界</text></g>
  <path class="ar" d="M890 200h35"/>
  <g transform="translate(925 105)"><rect class="n" width="240" height="190" rx="16"/><text x="120" y="34" text-anchor="middle" class="b">校准与风险解释</text><rect x="20" y="58" width="200" height="38" rx="9" fill="#e9f8f5"/><text x="120" y="82" text-anchor="middle" class="s">Conformal：仅扩张 P10–P90</text><rect x="20" y="110" width="200" height="38" rx="9" fill="#eef5ff"/><text x="120" y="134" text-anchor="middle" class="s">超阈概率：分段 CDF 近似</text><text x="120" y="174" text-anchor="middle" class="s">low · medium · high · extreme</text></g>
  <g transform="translate(35 366)"><rect width="1130" height="82" rx="14" fill="#fff" stroke="#d7e1ec"/><text x="24" y="31" class="b">图中路径</text><text x="24" y="58" class="s">模型输出未来 12 点流量/压力 P10、P50、P90；校准扩大区间而不改变 P50，风险等级表示相对设备阈值的近似超越概率分箱。</text></g>
</svg>
