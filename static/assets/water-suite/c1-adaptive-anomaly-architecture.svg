<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="c1-title c1-desc">
  <title id="c1-title">C1 深度分布漂移自适应异常检测架构</title>
  <desc id="c1-desc">流量和压力窗口经过 GRU 生成潜在表征，再计算重构、预测、边界和漂移证据；Top-K 正常记忆提供局部参考，最终输出自适应异常分数和候选。</desc>
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#edf7f8"/></linearGradient>
    <marker id="c1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3976a8"/></marker>
    <style>.c1-t{font:700 22px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.c1-b{font:700 16px Inter,Microsoft YaHei,sans-serif;fill:#17324d}.c1-s{font:13px Inter,Microsoft YaHei,sans-serif;fill:#536b82}.c1-n{fill:#fff;stroke:#8fb7dc;stroke-width:1.5}.c1-a{stroke:#3976a8;stroke-width:3;fill:none;marker-end:url(#c1-arrow)}</style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#c1-bg)"/>
  <text x="40" y="48" class="c1-t">C1：从流压窗口到自适应异常候选</text>
  <g transform="translate(40 100)"><rect class="c1-n" width="170" height="205" rx="16"/><text x="85" y="35" text-anchor="middle" class="c1-b">流量 · 压力窗口</text><path d="M22 105c22-62 39 43 61-6s42-43 66 8" fill="none" stroke="#1886b3" stroke-width="4"/><path d="M22 140c24-30 44 30 65-3s42-23 62 9" fill="none" stroke="#55a89b" stroke-width="3"/><text x="85" y="180" text-anchor="middle" class="c1-s">长度 96 · 缺失掩码</text></g>
  <path class="c1-a" d="M218 202h38"/>
  <g transform="translate(265 100)"><rect class="c1-n" width="180" height="205" rx="16"/><text x="90" y="35" text-anchor="middle" class="c1-b">GRU 编码器</text><rect x="24" y="68" width="132" height="42" rx="10" fill="#dceaff"/><text x="90" y="94" text-anchor="middle" class="c1-s">隐藏状态序列</text><path class="c1-a" d="M90 114v24"/><rect x="24" y="145" width="132" height="36" rx="10" fill="#e9f8f5"/><text x="90" y="168" text-anchor="middle" class="c1-s">潜在向量 zₜ</text></g>
  <path class="c1-a" d="M453 202h34"/>
  <g transform="translate(496 70)"><rect width="290" height="265" rx="18" fill="#eaf5f8" stroke="#7ea6cc" stroke-width="1.5"/><text x="145" y="34" text-anchor="middle" class="c1-b">多类证据与学习权重</text><rect x="22" y="58" width="246" height="38" rx="10" class="c1-n"/><text x="145" y="82" text-anchor="middle" class="c1-s">重构 + 0.25×边界误差</text><rect x="22" y="106" width="246" height="38" rx="10" class="c1-n"/><text x="145" y="130" text-anchor="middle" class="c1-s">一步预测误差</text><rect x="22" y="154" width="246" height="38" rx="10" class="c1-n"/><text x="145" y="178" text-anchor="middle" class="c1-s">前后半段潜在漂移</text><text x="145" y="224" text-anchor="middle" class="c1-s">权重 MLP → α, β, γ（softmax）</text></g>
  <path class="c1-a" d="M794 202h30"/>
  <g transform="translate(833 78)"><rect class="c1-n" width="175" height="245" rx="16"/><text x="87" y="34" text-anchor="middle" class="c1-b">Top-K 正常记忆</text><g fill="#cfe7e2"><circle cx="45" cy="78" r="9"/><circle cx="82" cy="62" r="9"/><circle cx="120" cy="88" r="9"/><circle cx="64" cy="115" r="9"/><circle cx="110" cy="128" r="9"/></g><text x="87" y="164" text-anchor="middle" class="c1-s">潜在空间最近邻</text><text x="87" y="188" text-anchor="middle" class="c1-s">RBF 局部均值 / 方差</text><text x="87" y="220" text-anchor="middle" class="c1-s">设备训练正常参考</text></g>
  <path class="c1-a" d="M1016 202h30"/>
  <g transform="translate(1055 100)"><rect class="c1-n" width="105" height="205" rx="16"/><text x="52" y="35" text-anchor="middle" class="c1-b">输出</text><rect x="14" y="68" width="77" height="36" rx="10" fill="#eee5ff"/><text x="52" y="91" text-anchor="middle" class="c1-s">异常分数</text><rect x="14" y="118" width="77" height="36" rx="10" fill="#dff3ee"/><text x="52" y="141" text-anchor="middle" class="c1-s">候选</text><text x="52" y="180" text-anchor="middle" class="c1-s">阈值比较</text></g>
  <g transform="translate(40 370)"><rect width="1120" height="70" rx="14" fill="#fff" stroke="#d7e1ec"/><text x="24" y="29" class="c1-b">关键机制</text><text x="24" y="53" class="c1-s">正常记忆是局部参考，不是异常标签库；分数衡量相对设备正常状态的证据偏离。</text></g>
</svg>
